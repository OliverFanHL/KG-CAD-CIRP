name: Validate research code
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[technical,dev]'
      - run: python -m pytest -q
      - run: python -m scripts.validate
      - run: python -m scripts.prepare_data
      - run: python -m scripts.reproduce --metrics-only
